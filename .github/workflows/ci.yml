name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and verification tools
        run: python -m pip install --upgrade "pip>=26.2,<27" "setuptools>=83.0.0" && python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Typecheck
        run: python -m mypy

      - name: Build
        run: python -m build

      - name: Dependency audit
        run: python -m pip_audit --local

      - name: CLI smoke test
        run: python -m wrongshell --shell powershell --format json "npm ci"
